<text x="1340" y="82" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">MEMORIZE · VISUALIZE · APPLY</text><rect x="70" y="175" width="400" height="410" rx="18" fill="#0d1b2a" stroke="#22d3ee" stroke-width="2"/><text x="88" y="206" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">TABLES / GRAIN</text><text x="88" y="235" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Rows live at a defined business grain.</text><text x="88" y="256" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Keys define relationships.</text><rect x="100" y="260" width="330" height="30" rx="7" fill="#12243a"/><text x="115" y="281" font-family="Inter,Arial" font-size="13" fill="#dbeafe">customer_id</text><rect x="100" y="300" width="330" height="30" rx="7" fill="#12243a"/><text x="115" y="321" font-family="Inter,Arial" font-size="13" fill="#dbeafe">order_id</text><rect x="100" y="340" width="330" height="30" rx="7" fill="#12243a"/><text x="115" y="361" font-family="Inter,Arial" font-size="13" fill="#dbeafe">order_date</text><rect x="100" y="380" width="330" height="30" rx="7" fill="#12243a"/><text x="115" y="401" font-family="Inter,Arial" font-size="13" fill="#dbeafe">amount</text><line x1="470" y1="330" x2="560" y2="330" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="575" y="175" width="350" height="410" rx="18" fill="#0d1b2a" stroke="#818cf8" stroke-width="2"/><text x="593" y="206" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">QUERY LOGIC</text><text x="593" y="235" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">FILTER → JOIN → GROUP → WINDOW → ORDER</text><text x="610" y="270" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="start">SELECT ...</text><text x="610" y="315" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="start">FROM ...</text><text x="610" y="360" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="start">WHERE ...</text><text x="610" y="405" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="start">GROUP BY ...</text><text x="610" y="450" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="start">ORDER BY ...</text><line x1="925" y1="330" x2="1015" y2="330" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="1030" y="175" width="300" height="410" rx="18" fill="#0d1b2a" stroke="#34d399" stroke-width="2"/><text x="1048" y="206" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">RESULT</text><text x="1048" y="235" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Correct grain + validated output</text><text x="1180" y="315" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="900" fill="#34d399" text-anchor="middle">ROWS</text><text x="1180" y="355" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="900" fill="#67e8f9" text-anchor="middle">→</text><text x="1180" y="405" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="900" fill="#f8fafc" text-anchor="middle">INSIGHT</text><rect x="60" y="650" width="1280" height="38" rx="19" fill="#0a1424" stroke="#243b53"/><circle cx="82" cy="669" r="7" fill="#22d3ee"/><text x="100" y="675" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">REMEMBER: Focus on the problem → pattern → trade-off → production use.</text></svg>