<text x="1340" y="82" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">MEMORIZE · VISUALIZE · APPLY</text><rect x="60" y="230" width="220" height="150" rx="18" fill="#0d1b2a" stroke="#22d3ee" stroke-width="2"/><text x="78" y="261" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">SOURCE EVENTS</text><line x1="280" y1="305" x2="315" y2="305" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="230" width="220" height="150" rx="18" fill="#0d1b2a" stroke="#818cf8" stroke-width="2"/><text x="338" y="261" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">BROKER / BUFFER</text><line x1="540" y1="305" x2="575" y2="305" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="230" width="220" height="150" rx="18" fill="#0d1b2a" stroke="#22d3ee" stroke-width="2"/><text x="598" y="261" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">PROCESS</text><line x1="800" y1="305" x2="835" y2="305" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="230" width="220" height="150" rx="18" fill="#0d1b2a" stroke="#818cf8" stroke-width="2"/><text x="858" y="261" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">WINDOW / STATE</text><line x1="1060" y1="305" x2="1095" y2="305" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><rect x="1100" y="230" width="220" height="150" rx="18" fill="#0d1b2a" stroke="#22d3ee" stroke-width="2"/><text x="1118" y="261" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">SINK / SERVE</text><rect x="170" y="440" width="1060" height="120" rx="18" fill="#0d1b2a" stroke="#334155" stroke-width="2"/><text x="188" y="471" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">Industry scenario</text><text x="188" y="500" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Design for retries, idempotency,</text><text x="188" y="521" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">observability and clear ownership. The</text><text x="188" y="542" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">diagram is the 30-second explanation.</text><rect x="60" y="650" width="1280" height="38" rx="19" fill="#0a1424" stroke="#243b53"/><circle cx="82" cy="669" r="7" fill="#22d3ee"/><text x="100" y="675" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">REMEMBER: Focus on the problem → pattern → trade-off → production use.</text></svg>