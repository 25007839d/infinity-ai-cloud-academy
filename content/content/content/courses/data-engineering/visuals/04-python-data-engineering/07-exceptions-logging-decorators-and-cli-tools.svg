<text x="60" y="82" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="850" fill="#f8fafc" text-anchor="start">Exceptions, Logging, Decorators and CLI Tools</text>
<text x="60" y="112" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#67e8f9" text-anchor="start">PYTHON FOR DATA ENGINEERING</text>
<text x="1340" y="82" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">MEMORIZE · VISUALIZE · APPLY</text><rect x="70" y="170" width="560" height="420" rx="18" fill="#0d1b2a" stroke="#22d3ee" stroke-width="2"/><text x="88" y="201" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">MENTAL MODEL</text><text x="88" y="230" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Input → operation → output → error</text><text x="88" y="251" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">handling</text><text x="100" y="250" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#dbeafe" text-anchor="start">def transform(rows):</text><text x="100" y="288" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#dbeafe" text-anchor="start">    valid = [r for r in rows if r]</text><text x="100" y="326" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#dbeafe" text-anchor="start">    return [r.strip() for r in valid]</text><rect x="690" y="170" width="640" height="190" rx="18" fill="#0d1b2a" stroke="#818cf8" stroke-width="2"/><text x="708" y="201" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">RUNTIME</text><text x="708" y="230" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Object / function → execution → result</text><rect x="690" y="390" width="640" height="200" rx="18" fill="#0d1b2a" stroke="#34d399" stroke-width="2"/><text x="708" y="421" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">ENGINEERING CHECK</text><text x="708" y="450" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Test • log • handle failure • make</text><text x="708" y="471" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">reruns safe</text><rect x="60" y="650" width="1280" height="38" rx="19" fill="#0a1424" stroke="#243b53"/><circle cx="82" cy="669" r="7" fill="#22d3ee"/><text x="100" y="675" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">REMEMBER: Focus on the problem → pattern → trade-off → production use.</text></svg>