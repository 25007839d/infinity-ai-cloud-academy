<rect x="42" y="36" width="1316" height="3" rx="2" fill="url(#accent)"/>
<text x="60" y="82" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="850" fill="#f8fafc" text-anchor="start">Stakeholder Communication and Data Product Thinking</text>
<text x="60" y="112" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#67e8f9" text-anchor="start">AGILE &amp; DATA ENGINEERING WORKPLACE</text>
<text x="1340" y="82" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="end">MEMORIZE · VISUALIZE · APPLY</text><rect x="80" y="180" width="380" height="400" rx="18" fill="#0d1b2a" stroke="#22d3ee" stroke-width="2"/><text x="98" y="211" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">CONCEPT</text><text x="98" y="240" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">What problem does this solve? What</text><text x="98" y="261" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">changes at 10× scale?</text><rect x="510" y="180" width="380" height="400" rx="18" fill="#0d1b2a" stroke="#818cf8" stroke-width="2"/><text x="528" y="211" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">PATTERN</text><text x="528" y="240" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Input → transform → output Define</text><text x="528" y="261" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">grain, contract and failure path.</text><rect x="940" y="180" width="380" height="400" rx="18" fill="#0d1b2a" stroke="#34d399" stroke-width="2"/><text x="958" y="211" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#f8fafc" text-anchor="start">PRODUCTION</text><text x="958" y="240" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Validate → observe → retry safely</text><text x="958" y="261" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Choose the simplest solution that</text><text x="958" y="282" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">fits.</text><rect x="60" y="650" width="1280" height="38" rx="19" fill="#0a1424" stroke="#243b53"/><circle cx="82" cy="669" r="7" fill="#22d3ee"/><text x="100" y="675" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="start">REMEMBER: Focus on the problem → pattern → trade-off → production use.</text></svg>