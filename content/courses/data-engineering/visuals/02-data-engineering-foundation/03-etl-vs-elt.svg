<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1d31"/><stop offset="1" stop-color="#050b14"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12243a"/><stop offset="1" stop-color="#0b1829"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="90" y="75" fill="#4fd1c5" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="800" letter-spacing="3">INFINITY AI CLOUD ACADEMY • CONCEPT VISUAL</text>
<text x="90" y="135" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="42" font-weight="800">ETL vs ELT</text>
<text x="90" y="170" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="18">01-data-engineering-foundations</text>
<rect x="90" y="225" width="690" height="500" rx="26" fill="url(#card)" stroke="#4fd1c5" stroke-width="3" filter="url(#shadow)"/>
<text x="124" y="283" fill="#4fd1c5" font-family="Inter,Segoe UI,Arial" font-size="26" font-weight="800">ETL</text>
<text x="124" y="330" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="22">Extract → Transform → Load •</text>
<text x="124" y="368" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="22">transformation before warehouse load •</text>
<text x="124" y="406" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="22">useful when target must receive curated</text>
<text x="124" y="444" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="22">data</text>
<rect x="820" y="225" width="690" height="500" rx="26" fill="url(#card)" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)"/>
<text x="854" y="283" fill="#38bdf8" font-family="Inter,Segoe UI,Arial" font-size="26" font-weight="800">ELT</text>
<text x="854" y="330" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="22">Extract → Load → Transform • raw data</text>
<text x="854" y="368" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="22">lands first • warehouse/lakehouse performs</text>
<text x="854" y="406" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="22">transformation</text>
<rect x="90" y="755" width="690" height="88" rx="18" fill="#0b1828" stroke="transformation"/>
<text x="112" y="787" fill="#fbbf24" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="800">ETL</text>
<text x="112" y="817" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="18">Transform outside target</text>
<rect x="820" y="755" width="690" height="88" rx="18" fill="#0b1828" stroke="transformation"/>
<text x="842" y="787" fill="#fbbf24" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="800">ELT</text>
<text x="842" y="817" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="18">Transform inside target</text>
</svg>