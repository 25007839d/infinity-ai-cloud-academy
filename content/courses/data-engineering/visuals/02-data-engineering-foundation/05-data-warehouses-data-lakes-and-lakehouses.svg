<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1d31"/><stop offset="1" stop-color="#050b14"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12243a"/><stop offset="1" stop-color="#0b1829"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="90" y="75" fill="#4fd1c5" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="800" letter-spacing="3">INFINITY AI CLOUD ACADEMY • CONCEPT VISUAL</text>
<text x="90" y="135" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="42" font-weight="800">Data Warehouses, Data Lakes and Lakehouses</text>
<text x="90" y="170" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="18">02-data-engineering-foundation</text>
<rect x="90" y="245" width="690" height="205" rx="24" fill="url(#card)" stroke="#24415f" stroke-width="2" filter="url(#shadow)"/>
<circle cx="132" cy="287" r="20" fill="#4fd1c5"/><text x="132" y="294" text-anchor="middle" fill="#04101b" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900">1</text>
<text x="168" y="294" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800">WAREHOUSE</text>
<text x="124" y="337" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="19">Curated structured analytics • SQL / BI •</text>
<text x="124" y="367" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="19">strong schema</text>
<rect x="805" y="245" width="690" height="205" rx="24" fill="url(#card)" stroke="strong schema" stroke-width="2" filter="url(#shadow)"/>
<circle cx="847" cy="287" r="20" fill="#38bdf8"/><text x="847" y="294" text-anchor="middle" fill="#04101b" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900">2</text>
<text x="883" y="294" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800">LAKE</text>
<text x="839" y="337" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="19">Low-cost raw files • many formats •</text>
<text x="839" y="367" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="19">flexible storage</text>
<rect x="90" y="505" width="690" height="205" rx="24" fill="url(#card)" stroke="flexible storage" stroke-width="2" filter="url(#shadow)"/>
<circle cx="132" cy="547" r="20" fill="#fbbf24"/><text x="132" y="554" text-anchor="middle" fill="#04101b" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900">3</text>
<text x="168" y="554" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800">LAKEHOUSE</text>
<text x="124" y="597" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="19">Lake storage + warehouse-style tables,</text>
<text x="124" y="627" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="19">governance and analytics</text>
<rect x="805" y="505" width="690" height="205" rx="24" fill="url(#card)" stroke="governance and analytics" stroke-width="2" filter="url(#shadow)"/>
<circle cx="847" cy="547" r="20" fill="#a78bfa"/><text x="847" y="554" text-anchor="middle" fill="#04101b" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="900">4</text>
<text x="883" y="554" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800">MEMORY</text>
<text x="839" y="597" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="19">Warehouse = curated • Lake = raw •</text>
<text x="839" y="627" fill="#a9bad0" font-family="Inter,Segoe UI,Arial" font-size="19">Lakehouse = both</text>
<path d="M780 345 H805" stroke="#38bdf8" stroke-width="4"/><path d="M798 337 l14 8 -14 8" fill="none" stroke="#38bdf8" stroke-width="4"/>
<path d="M435 475 V505" stroke="#38bdf8" stroke-width="4"/><path d="M427 493 l8 14 8-14" fill="none" stroke="#38bdf8" stroke-width="4"/>
<path d="M780 605 H805" stroke="#38bdf8" stroke-width="4"/><path d="M798 597 l14 8 -14 8" fill="none" stroke="#38bdf8" stroke-width="4"/>
<rect x="90" y="755" width="1405" height="88" rx="18" fill="#0b1828" stroke="#4fd1c5" stroke-width="2"/>
<text x="115" y="790" fill="#4fd1c5" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="800">MEMORIZE</text>
<text x="115" y="822" fill="#f5f9ff" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="700">Warehouse = curated analytics; Lake = raw flexibility; Lakehouse = convergence.</text>
